# Vendored copy of tiberius-ng 0.13.1 (crates.io) with a small additive patch for
# Cobalt SQL Works. See COBALT-PATCH.md for the exact changes. Wired in through
# `[patch.crates-io]` in the workspace root, so `tiberius = { package = "tiberius-ng" }`
# keeps working unchanged.
[package]
name = "tiberius-ng"
version = "0.13.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A TDS (Microsoft SQL Server) driver for Rust — actively-maintained community continuation of tiberius (vendored + patched for Cobalt SQL Works)"
repository = "https://github.com/MattJackson/tiberius-ng"
publish = false
autotests = false
autoexamples = false
autobenches = false

[lib]
name = "tiberius"

[dependencies]
enumflags2 = "0.7"
byteorder = "1.0"
encoding_rs = "0.8"
once_cell = "1.3"
thiserror = "2"
bytes = "1.0"
pretty-hex = "0.4"
pin-project-lite = "0.2"
asynchronous-codec = "0.7"
async-trait = "0.1"
connection-string = "0.2"
num-traits = "0.2"
uuid = "1.0"
zeroize = "1.8.2"
tiberius-ng-macros = "0.1.0"

[target.'cfg(windows)'.dependencies]
winauth = { version = "0.0.5", optional = true }

[target.'cfg(unix)'.dependencies]
libgssapi = { version = "0.11", optional = true, default-features = false }
sspi = { version = "0.18", optional = true }
libc = "0.2"

[dependencies.async-native-tls]
version = "0.6"
optional = true

[dependencies.tokio]
version = "1.0"
optional = true
features = ["net", "time"]

[dependencies.tokio-util]
version = "0.7"
features = ["compat"]
optional = true

[dependencies.chrono]
version = "0.4"
optional = true
default-features = false

[dependencies.time]
version = "0.3"
optional = true

[dependencies.futures-util]
version = "0.3"
default-features = false
features = ["io", "sink"]

[dependencies.tracing]
features = ["log"]
version = "0.1"

[dependencies.rust_decimal]
version = "1.6"
optional = true

[dependencies.bigdecimal_]
version = "0.4"
optional = true
package = "bigdecimal"

[dependencies.serde]
version = "1.0"
optional = true
features = ["derive", "rc"]

[dependencies.async-io]
version = "2"
optional = true

[dependencies.async-net]
version = "2"
optional = true

[dependencies.futures-lite]
version = "2"
optional = true

[dependencies.tokio-rustls]
version = "0.26"
optional = true

[dependencies.rustls-native-certs]
version = "0.8"
optional = true

[dependencies.opentls]
version = "0.2.1"
optional = true
features = ["io-async-std", "vendored"]

[dev-dependencies.tokio]
features = ["macros", "sync", "io-std", "time", "io-util", "net", "rt-multi-thread"]
version = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[features]
all = ["chrono", "time", "tds73", "tds80", "sql-browser-tokio", "sql-browser-smol", "integrated-auth-gssapi", "rust_decimal", "bigdecimal", "native-tls", "serde", "sspi-rs"]
default = ["tds80", "winauth", "native-tls"]
tds73 = []
tds80 = ["tds73"]
sql-browser-tokio = ["tokio", "tokio-util"]
sql-browser-smol = ["async-io", "async-net", "futures-lite"]
integrated-auth-gssapi = ["libgssapi"]
bigdecimal = ["bigdecimal_"]
rustls = ["tokio-rustls", "tokio-util", "rustls-native-certs"]
native-tls = ["async-native-tls"]
vendored-openssl = ["opentls"]
sspi-rs = ["sspi"]
serde = ["dep:serde", "uuid/serde"]
