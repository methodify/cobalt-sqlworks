[package]
name = "cobalt-app"
description = "Cobalt SQL Works desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "cobalt"

[[bin]]
name = "cobalt"
path = "src/main.rs"

[features]
default = ["agent"]
# Compile the egui_agent control channel in (still inert unless COBALT_AGENT=1).
agent = ["dep:egui_agent", "dep:egui_agent_macros"]

[dependencies]
cobalt-core.workspace = true
cobalt-driver.workspace = true
cobalt-auth.workspace = true
cobalt-store.workspace = true
cobalt-sql.workspace = true
cobalt-results.workspace = true
cobalt-export.workspace = true
cobalt-export-delta.workspace = true
cobalt-plan.workspace = true

egui.workspace = true
eframe.workspace = true
egui_extras.workspace = true
egui_table.workspace = true
egui_dock.workspace = true
egui-notify.workspace = true
egui-phosphor.workspace = true
egui_agent = { workspace = true, optional = true }
egui_agent_macros = { workspace = true, optional = true }

arrow.workspace = true
tokio.workspace = true
crossbeam-channel.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
directories.workspace = true
rfd.workspace = true
open.workspace = true
indexmap.workspace = true
humansize.workspace = true
once_cell.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
egui_agent = { workspace = true, features = ["test-harness"] }

[package.metadata.winres]
ProductName = "Cobalt SQL Works"
