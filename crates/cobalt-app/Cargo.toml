[package]
name = "cobalt-app"
description = "Cobalt SQL Works desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "cobalt"

[[bin]]
name = "cobalt"
path = "src/main.rs"

[features]
default = []
# Dev only: compile the egui_agent control channel in (`--features agent`; inert unless
# COBALT_AGENT=1). Release builds never include it.
agent = ["dep:egui_agent", "dep:egui_agent_macros"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
cobalt-core.workspace = true
cobalt-driver.workspace = true
cobalt-auth.workspace = true
cobalt-store.workspace = true
cobalt-sql.workspace = true
cobalt-results.workspace = true
cobalt-export.workspace = true
cobalt-export-delta.workspace = true
cobalt-plan.workspace = true
cobalt-fabric.workspace = true

egui.workspace = true
eframe.workspace = true
egui_extras.workspace = true
egui_table.workspace = true
egui_dock.workspace = true
egui-notify.workspace = true
egui-phosphor.workspace = true
egui_agent = { workspace = true, optional = true }
egui_agent_macros = { workspace = true, optional = true }

arrow.workspace = true
tokio.workspace = true
crossbeam-channel.workspace = true
reqwest.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
directories.workspace = true
rfd.workspace = true
open.workspace = true
indexmap.workspace = true
humansize.workspace = true
once_cell.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
egui_agent = { workspace = true, features = ["test-harness"] }

[build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "Cobalt SQL Works"
identifier = "dev.cobalt.sqlworks"
description = "A fast, focused SQL client for SQL Server, Azure SQL and Microsoft Fabric"
long-description = "Cobalt SQL Works is a free, open-source, cross-platform desktop SQL client — the spiritual successor to Azure Data Studio. Pure Rust + egui."
authors = ["Bryon Williams"]
homepage = "https://cobaltsql.org"
license-file = "../../LICENSE-MIT"
category = "DeveloperTool"
formats = ["nsis", "deb", "appimage"]
out-dir = "../../dist/packages"
before-packaging-command = ""
binaries = [{ path = "cobalt", main = true }]
file-associations = [
    { extensions = ["sql"], description = "SQL script", mime-type = "application/sql" },
    { extensions = ["sqlplan"], description = "SQL Server execution plan", mime-type = "application/xml" },
]
icons = ["../../assets/icon.ico", "../../assets/icons/32x32.png", "../../assets/icons/128x128.png", "../../assets/icons/128x128@2x.png", "../../assets/icons/icon_256.png"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"

[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libwayland-client0", "libgl1", "libfontconfig1", "libdbus-1-3", "libssl3"]
