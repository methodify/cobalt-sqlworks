name: Release

# Builds installers for a version tag (v1.2.3) and publishes them as a GitHub release.
# The tag must match the workspace version in Cargo.toml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$cargo_version" ]]; then
              echo "tag v$tag does not match Cargo.toml version $cargo_version" >&2
              exit 1
            fi
          fi

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-packager (prebuilt)
        run: cargo binstall -y cargo-packager
      - name: Build
        run: cargo build --release -p cobalt-app --locked
      - name: Package (NSIS installer)
        run: cargo packager --release --formats nsis -p cobalt-app
      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ needs.check-version.outputs.version }}"
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target/release/cobalt.exe stage/cobalt-windows-x86_64.exe
          Copy-Item docs/alpha_notes.md stage/ALPHA_NOTES.md
          Copy-Item LICENSE-MIT, LICENSE-APACHE stage/
          Compress-Archive -Force -Path stage/* -DestinationPath "dist/packages/cobalt-sqlworks-$v-windows-x86_64.zip"
          Get-ChildItem dist/packages
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/packages/*.exe
            dist/packages/*.zip
          if-no-files-found: error

  linux:
    needs: check-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev \
            libfontconfig1-dev libdbus-1-dev cmake clang file
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-packager (prebuilt)
        run: cargo binstall -y cargo-packager
      - name: Build
        run: cargo build --release -p cobalt-app --locked
      - name: Package (deb, AppImage)
        run: cargo packager --release --formats deb,appimage -p cobalt-app
      - name: Tarball
        run: |
          v="${{ needs.check-version.outputs.version }}"
          mkdir -p stage
          cp target/release/cobalt stage/cobalt-linux-x86_64
          cp docs/alpha_notes.md stage/ALPHA_NOTES.md
          cp LICENSE-MIT LICENSE-APACHE stage/
          tar -czf "dist/packages/cobalt-sqlworks-$v-linux-x86_64.tar.gz" -C stage .
          ls -la dist/packages
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/packages/*.deb
            dist/packages/*.AppImage
            dist/packages/*.tar.gz
          if-no-files-found: error

  macos:
    # Builds but is not yet tested by a human: never block the release on it.
    needs: check-version
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-packager (prebuilt)
        run: cargo binstall -y cargo-packager
      - name: Build
        run: cargo build --release -p cobalt-app --locked
      - name: Package (app bundle, ad-hoc signed, dmg)
        # No Apple Developer ID yet. Apple Silicon refuses to launch an app bundle without a
        # signature ("damaged and can't be opened"), so seal the bundle with an ad-hoc signature:
        # macOS then shows the usual "unidentified developer" prompt instead (right-click > Open).
        run: |
          set -euo pipefail
          cargo packager --release --formats app -p cobalt-app
          app="$(ls -d dist/packages/*.app | head -1)"
          echo "bundle: $app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          v="${{ needs.check-version.outputs.version }}"
          staging="$(mktemp -d)"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Cobalt SQL Works" -srcfolder "$staging" -ov -format UDZO "dist/packages/cobalt-sqlworks-$v-macos-aarch64.dmg"
          rm -rf "$app"
          ls -la dist/packages
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/packages/*.dmg
          if-no-files-found: warn

  release:
    needs: [check-version, windows, linux, macos]
    if: always() && needs.windows.result == 'success' && needs.linux.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List
        run: find artifacts -type f | sort
      - name: Checksums
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS -exec sha256sum {} \; | sed 's# \./[^/]*/# #' > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          mapfile -t files < <(find artifacts -type f | sort)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Cobalt SQL Works ${{ needs.check-version.outputs.version }}" \
              --generate-notes
          fi
