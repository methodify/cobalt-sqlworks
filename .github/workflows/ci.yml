name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "site/**", "**/*.md", ".github/workflows/pages.yml", ".github/workflows/release.yml"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    # One Linux leg: the Windows and macOS compiles are exercised by the release workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev \
            libfontconfig1-dev libdbus-1-dev cmake clang
      - name: Test
        run: cargo test --workspace --locked
      - name: Check the dev-only agent feature still compiles
        run: cargo check -p cobalt-app --features agent --locked
